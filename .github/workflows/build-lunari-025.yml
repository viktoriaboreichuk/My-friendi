name: Build Lunari 0.2.5

on:
  push:
    branches: [ "lunari-ui-refresh" ]
  workflow_dispatch:

jobs:
  build025:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
          cache-provider: basic

      - name: Restore exact approved 51474 background
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pillow
          python - <<'PY'
          from pathlib import Path
          import base64, io, re
          from PIL import Image

          src = Path("assets/v025/approved85")
          out = Path("app/src/main/res/drawable-nodpi/lunari_home_bg.png")
          out.parent.mkdir(parents=True, exist_ok=True)
          if not src.exists():
              raise SystemExit("approved85 chunk directory is missing")

          def nkey(p: Path):
              nums = re.findall(r"\d+", p.name)
              return tuple(int(x) for x in nums) if nums else (0,)

          def group(prefix):
              return sorted(src.glob(prefix + "*.b64"), key=nkey)

          bg = group("bg")
          tail = group("tail")
          rest = group("rest")
          other = sorted(
              [p for p in src.glob("*.b64") if p not in set(bg + tail + rest)],
              key=lambda p: p.name
          )

          print("approved85 files:", [(p.name, p.stat().st_size) for p in sorted(src.glob('*.b64'))])

          candidates = []
          def add(name, paths, mode="joined"):
              if paths:
                  candidates.append((name, paths, mode))

          # The approved background was uploaded in stages during the interrupted session.
          # Try only deterministic orderings of those exact chunks; never generate replacement art.
          add("bg+tail joined", bg + tail)
          add("bg+rest joined", bg + rest)
          add("bg+rest+tail joined", bg + rest + tail)
          add("rest+tail joined", rest + tail)
          add("rest joined", rest)
          add("bg joined", bg)
          add("tail joined", tail)
          add("all joined", sorted(src.glob("*.b64"), key=lambda p: p.name))
          add("bg+tail individually decoded", bg + tail, "individual")
          add("bg+rest+tail individually decoded", bg + rest + tail, "individual")
          add("rest individually decoded", rest, "individual")

          def clean_text(p):
              return "".join(p.read_text(encoding="utf-8").split())

          def decode_joined(paths):
              s = "".join(clean_text(p) for p in paths)
              s += "=" * ((4 - len(s) % 4) % 4)
              return base64.b64decode(s, validate=False)

          def decode_individual(paths):
              chunks = []
              for p in paths:
                  s = clean_text(p)
                  s += "=" * ((4 - len(s) % 4) % 4)
                  chunks.append(base64.b64decode(s, validate=False))
              return b"".join(chunks)

          def valid_png(raw):
              if not raw.startswith(b"\x89PNG\r\n\x1a\n"):
                  return None
              try:
                  with Image.open(io.BytesIO(raw)) as im:
                      size = im.size
                      mode = im.mode
                      im.verify()
                  # Approved background is a substantial portrait artwork, not an icon/chunk.
                  if size[1] <= size[0] or size[0] < 700 or size[1] < 1000:
                      return None
                  return size, mode
              except Exception:
                  return None

          for name, paths, mode in candidates:
              try:
                  raw = decode_individual(paths) if mode == "individual" else decode_joined(paths)
              except Exception as e:
                  print(name, "decode failed:", repr(e))
                  continue
              info = valid_png(raw)
              print(name, "bytes=", len(raw), "valid=", info)
              if info:
                  out.write_bytes(raw)
                  print("RESTORED EXACT APPROVED BACKGROUND:", name, info, out)
                  break
          else:
              raise SystemExit("Could not reconstruct a complete approved 51474 PNG from committed chunks")
          PY

      - name: Activate 0.2.5 UI and version
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          gradle = Path("app/build.gradle.kts")
          s = gradle.read_text(encoding="utf-8")
          s, n1 = re.subn(r"versionCode\s*=\s*\d+", "versionCode = 7", s, count=1)
          s, n2 = re.subn(r'versionName\s*=\s*"[^"]+"', 'versionName = "0.2.5"', s, count=1)
          if n1 != 1 or n2 != 1:
              raise SystemExit("Could not patch app version")
          gradle.write_text(s, encoding="utf-8")

          screens = Path("app/src/main/java/com/vega/yakor/Screens.kt")
          s = screens.read_text(encoding="utf-8")
          s, n = re.subn(
              r"Route\.Home\s*->\s*[A-Za-z0-9_]+\(store,\s*navigate\)",
              "Route.Home -> LunariHomeV025(store, navigate)",
              s,
              count=1
          )
          if n != 1 and "Route.Home -> LunariHomeV025(store, navigate)" not in s:
              raise SystemExit("Could not activate LunariHomeV025")
          screens.write_text(s, encoding="utf-8")
          PY

      - name: Confirm protected artwork was not replaced
        shell: bash
        run: |
          test -s app/src/main/res/drawable-nodpi/lunari_home_bg.png
          # Existing card artwork and launcher resources are intentionally left untouched.
          grep -q 'lunari_character' app/src/main/java/com/vega/yakor/LunariHomeV025.kt
          grep -q 'lunari_world' app/src/main/java/com/vega/yakor/LunariHomeV025.kt
          grep -q 'lunari_chat' app/src/main/java/com/vega/yakor/LunariHomeV025.kt
          grep -q 'lunari_memory' app/src/main/java/com/vega/yakor/LunariHomeV025.kt
          grep -q 'lunari_profiles' app/src/main/java/com/vega/yakor/LunariHomeV025.kt
          grep -q 'lunari_snapshots' app/src/main/java/com/vega/yakor/LunariHomeV025.kt

      - name: Build 0.2.5 APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK and package metadata
        shell: bash
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk | head -n 2
          sha256sum app/build/outputs/apk/debug/app-debug.apk

      - name: Prepare signing tools with build artifact
        shell: bash
        run: |
          mkdir -p /tmp/lunari025
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/lunari025/Lunari-0.2.5-unsigned-base.apk
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" /tmp/lunari025/apksigner.jar

      - name: Upload 0.2.5 base artifact
        uses: actions/upload-artifact@v4
        with:
          name: lunari-0.2.5-unsigned-base
          path: /tmp/lunari025/
          if-no-files-found: error

name: Legacy Lunari 0.2.9.4 glow contour (retired)

# Historical 0.2.9.4 patch workflow.
# Retired from automatic PR checks so later Lunari patches do not rebuild an old release recipe.
# The exact original workflow remains recoverable from Git history and the accepted 0.2.9.4 run.
on:
  workflow_dispatch:

jobs:
  legacy-info:
    runs-on: ubuntu-latest
    steps:
      - name: Historical workflow notice
        run: |
          echo "Lunari 0.2.9.4 glow-contour workflow is retired from active CI."
          echo "Use Git history / the accepted 0.2.9.4 GREEN run for exact historical reproduction."

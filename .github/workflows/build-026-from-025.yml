name: Build Lunari 0.2.6 from 0.2.5

on:
  workflow_dispatch:
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
          cache-provider: basic

      - name: Verify and install exact Lunari 0.2.6 UI assets
        shell: bash
        run: |
          set -euo pipefail
          PACK="Lunari-0.2.6-ui-assets.zip"
          test -s "$PACK"
          echo "6f19916fb7a5b556eb24d9bb702120af7f78131c19ac2a3e4564b8f3093d1ec3  $PACK" | sha256sum -c -
          unzip -t "$PACK"
          rm -rf /tmp/lunari026-assets
          mkdir -p /tmp/lunari026-assets app/src/main/res/drawable-nodpi
          unzip -q "$PACK" -d /tmp/lunari026-assets

          cat > /tmp/lunari026.sha256 <<'EOF'
          c0e4cf96971e10de6f147314caf3f81e6c0426cfa1a6049966b6325745a6e16a  /tmp/lunari026-assets/lunari_logo_026.webp
          ce6b2e5278636edee3fa91c55c12d98d170204600601d23edcbe55cf37071165  /tmp/lunari026-assets/lunari_card_overlay_01.webp
          5bfa8d8ef72ed4131e33acfbc3bbe816d114b62f663da8a464b68f6204711460  /tmp/lunari026-assets/lunari_card_overlay_02.webp
          acf341f1ef107210e39d3ea06f61c52985ccb63f698a6f3ec52e1bd0336de18e  /tmp/lunari026-assets/lunari_card_overlay_03.webp
          f1bc5eeeca07318bbc872ba788b428dbe83a226248f04bf0e06d09de25dd9c68  /tmp/lunari026-assets/lunari_card_overlay_04.webp
          c4f8aa905451b7690772bfa78069182aa68a98826f197bf05cc9ef96ff7f6a8e  /tmp/lunari026-assets/lunari_card_overlay_05.webp
          be1ea05679e561633273f28e480ed7f3cb7711c65a0a8d923e5669f76c5272d6  /tmp/lunari026-assets/lunari_card_overlay_06.webp
          2517ad57dd6d5060f1f9e8f5105e990c10ca7cc8a02f3d799b7084000e0a199e  /tmp/lunari026-assets/lunari_home_bg_v025.webp
          EOF
          sed -i 's/^          //' /tmp/lunari026.sha256
          sha256sum -c /tmp/lunari026.sha256

          for f in /tmp/lunari026-assets/*.webp; do
            test "$(head -c 4 "$f")" = "RIFF"
            test "$(dd if="$f" bs=1 skip=8 count=4 status=none)" = "WEBP"
          done

          cp /tmp/lunari026-assets/lunari_logo_026.webp app/src/main/res/drawable-nodpi/
          cp /tmp/lunari026-assets/lunari_card_overlay_0*.webp app/src/main/res/drawable-nodpi/
          cp /tmp/lunari026-assets/lunari_home_bg_v025.webp app/src/main/res/drawable-nodpi/

      - name: Verify preserved 0.2.5 category artwork
        shell: bash
        run: |
          set -euo pipefail
          test -s app/src/main/res/drawable-nodpi/lunari_character.webp
          test -s app/src/main/res/drawable-nodpi/lunari_world.webp
          test -s app/src/main/res/drawable-nodpi/lunari_chat.webp
          test -s app/src/main/res/drawable-nodpi/lunari_memory.webp
          test -s app/src/main/res/drawable-nodpi/lunari_profiles.webp
          test -s app/src/main/res/drawable-nodpi/lunari_snapshots.webp

      - name: Verify version and activate Lunari home
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'applicationId = "com.vega.yakor"' app/build.gradle.kts
          grep -F 'versionCode = 8' app/build.gradle.kts
          grep -F 'versionName = "0.2.6"' app/build.gradle.kts
          python - <<'PY'
          from pathlib import Path
          p = Path("app/src/main/java/com/vega/yakor/Screens.kt")
          s = p.read_text(encoding="utf-8")
          old = "Route.Home -> HomeScreen(store, navigate)"
          new = "Route.Home -> LunariHomeV2(store, navigate)"
          if old in s:
              s = s.replace(old, new, 1)
          elif new not in s:
              raise SystemExit("Home route marker not found")
          p.write_text(s, encoding="utf-8")
          PY

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK exists
        shell: bash
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk

      - name: Verify APK alignment and build signature
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 -v 4 "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lunari-0.2.6-unsigned-base
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

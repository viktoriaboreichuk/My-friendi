name: Export Android apksigner

on:
  pull_request:
    branches: [ "main", "master" ]

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android build tools
        run: sdkmanager "build-tools;35.0.0"

      - name: Verify apksigner jar
        shell: bash
        run: |
          set -euo pipefail
          test -s "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar"
          sha256sum "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar"

      - name: Upload apksigner jar
        uses: actions/upload-artifact@v4
        with:
          name: android-apksigner-35
          path: ${{ env.ANDROID_HOME }}/build-tools/35.0.0/lib/apksigner.jar
          if-no-files-found: error

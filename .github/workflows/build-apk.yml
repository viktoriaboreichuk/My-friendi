name: Build Lunari APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master", "lunari-ui-refresh" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
          cache-provider: basic

      - name: Restore exact Lunari 0.2.4 artwork
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/res/drawable-nodpi
          rm -f app/src/main/res/drawable-nodpi/lunari_home_bg.* \
                app/src/main/res/drawable-nodpi/lunari_character.* \
                app/src/main/res/drawable-nodpi/lunari_world.* \
                app/src/main/res/drawable-nodpi/lunari_chat.* \
                app/src/main/res/drawable-nodpi/lunari_memory.* \
                app/src/main/res/drawable-nodpi/lunari_profiles.* \
                app/src/main/res/drawable-nodpi/lunari_snapshots.* \
                app/src/main/res/drawable-nodpi/lunari_launcher_icon.*

          cat assets/v024/artwork.part1.b64 \
              assets/v024/artwork.part2.b64 \
              assets/v024/artwork.part3.b64 \
            | tr -d '\r\n' \
            | base64 --decode > /tmp/lunari024-artwork.tar.gz

          echo "6274be431bc705ad4bed27048e9de59240656d608a22a731dcbf6c4721eeea64  /tmp/lunari024-artwork.tar.gz" | sha256sum -c -
          tar -xzf /tmp/lunari024-artwork.tar.gz -C app/src/main/res/drawable-nodpi

          tr -d '\r\n' < assets/v024/lunari_launcher_icon.webp.b64 \
            | base64 --decode > app/src/main/res/drawable-nodpi/lunari_launcher_icon.webp
          echo "8e685a9beafd304a7fa8cd47fdb4d60a0895b58383b4823677ad2a49cb1e69ea  app/src/main/res/drawable-nodpi/lunari_launcher_icon.webp" | sha256sum -c -

          test -s app/src/main/res/drawable-nodpi/lunari_home_bg.webp
          test -s app/src/main/res/drawable-nodpi/lunari_character.webp
          test -s app/src/main/res/drawable-nodpi/lunari_world.webp
          test -s app/src/main/res/drawable-nodpi/lunari_chat.webp
          test -s app/src/main/res/drawable-nodpi/lunari_memory.webp
          test -s app/src/main/res/drawable-nodpi/lunari_profiles.webp
          test -s app/src/main/res/drawable-nodpi/lunari_snapshots.webp
          test -s app/src/main/res/drawable-nodpi/lunari_launcher_icon.webp
          file app/src/main/res/drawable-nodpi/lunari_*.webp

      - name: Activate Lunari reference home
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("app/src/main/java/com/vega/yakor/Screens.kt")
          s=p.read_text(encoding="utf-8")
          old="Route.Home -> HomeScreen(store, navigate)"
          new="Route.Home -> LunariHomeV2(store, navigate)"
          if old in s:
              s=s.replace(old,new,1)
          elif new not in s:
              raise SystemExit("Home route marker not found")
          p.write_text(s,encoding="utf-8")
          PY

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify build artifact
        shell: bash
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lunari-0.2.4-unsigned-base
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

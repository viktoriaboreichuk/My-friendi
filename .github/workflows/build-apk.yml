name: Build Lunari APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master", "lunari-ui-refresh" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
          cache-provider: basic

      - name: Restore Lunari signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: lunari-stable-debug-key-v1

      - name: Ensure stable debug signing key
        shell: bash
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore ~/.android/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Lunari,C=NL" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi

      - name: Restore Lunari reference artwork
        shell: bash
        run: |
          mkdir -p app/src/main/res/drawable-nodpi
          base64 --decode assets/lunari_home_bg.b64 > app/src/main/res/drawable-nodpi/lunari_home_bg.jpg
          base64 --decode assets/lunari_launcher_icon.b64 > app/src/main/res/drawable-nodpi/lunari_launcher_icon.jpg
          file app/src/main/res/drawable-nodpi/lunari_home_bg.jpg
          file app/src/main/res/drawable-nodpi/lunari_launcher_icon.jpg

      - name: Activate Lunari reference home
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("app/src/main/java/com/vega/yakor/Screens.kt")
          s = p.read_text(encoding="utf-8")
          old = "Route.Home -> HomeScreen(store, navigate)"
          new = "Route.Home -> LunariHomeV2(store, navigate)"
          if old not in s:
              raise SystemExit("Home route marker not found")
          p.write_text(s.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lunari-0.2.0-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

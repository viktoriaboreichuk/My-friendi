name: Build Lunari APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master", "lunari-ui-refresh" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
          cache-provider: basic

      - name: Restore exact Lunari 0.2.4 artwork
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/res/drawable-nodpi
          rm -f app/src/main/res/drawable-nodpi/lunari_home_bg.* \
                app/src/main/res/drawable-nodpi/lunari_character.* \
                app/src/main/res/drawable-nodpi/lunari_world.* \
                app/src/main/res/drawable-nodpi/lunari_chat.* \
                app/src/main/res/drawable-nodpi/lunari_memory.* \
                app/src/main/res/drawable-nodpi/lunari_profiles.* \
                app/src/main/res/drawable-nodpi/lunari_snapshots.* \
                app/src/main/res/drawable-nodpi/lunari_launcher_icon.*

          python - <<'PY'
          from pathlib import Path
          import base64, tarfile

          parts = []
          for i in (1, 2, 3):
              text = Path(f"assets/v024/artwork.part{i}.b64").read_text(encoding="utf-8")
              parts.append("".join(text.split()))
          archive = base64.b64decode("".join(parts), validate=False)
          archive_path = Path("/tmp/lunari024-artwork.tar.gz")
          archive_path.write_bytes(archive)

          target = Path("app/src/main/res/drawable-nodpi")
          with tarfile.open(archive_path, "r:gz") as tf:
              tf.extractall(target)

          icon_text = Path("assets/v024/lunari_launcher_icon.webp.b64").read_text(encoding="utf-8")
          icon = base64.b64decode("".join(icon_text.split()), validate=False)
          (target / "lunari_launcher_icon.webp").write_bytes(icon)

          required = [
              "lunari_home_bg.webp",
              "lunari_character.webp",
              "lunari_world.webp",
              "lunari_chat.webp",
              "lunari_memory.webp",
              "lunari_profiles.webp",
              "lunari_snapshots.webp",
              "lunari_launcher_icon.webp",
          ]
          for name in required:
              p = target / name
              if not p.is_file() or p.stat().st_size < 1000:
                  raise SystemExit(f"Missing artwork: {name}")
              print(name, p.stat().st_size)
          PY

      - name: Activate Lunari reference home
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("app/src/main/java/com/vega/yakor/Screens.kt")
          s=p.read_text(encoding="utf-8")
          old="Route.Home -> HomeScreen(store, navigate)"
          new="Route.Home -> LunariHomeV2(store, navigate)"
          if old in s:
              s=s.replace(old,new,1)
          elif new not in s:
              raise SystemExit("Home route marker not found")
          p.write_text(s,encoding="utf-8")
          PY

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify build artifact
        shell: bash
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lunari-0.2.4-unsigned-base
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

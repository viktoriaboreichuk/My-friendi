name: Build Lunari APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master", "lunari-ui-refresh" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
          cache-provider: basic

      - name: Restore Lunari signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: lunari-stable-debug-key-v1

      - name: Ensure stable debug signing key
        shell: bash
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore ~/.android/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Lunari,C=NL" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi

      - name: Generate validated Lunari artwork
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check pillow
          mkdir -p app/src/main/res/drawable-nodpi
          python - <<'PY'
          from PIL import Image, ImageDraw, ImageFilter
          from pathlib import Path
          import random, math

          out = Path('app/src/main/res/drawable-nodpi')
          random.seed(27)

          def vertical_gradient(size, top, bottom):
              w,h=size
              im=Image.new('RGB',size)
              d=ImageDraw.Draw(im)
              for y in range(h):
                  t=y/max(1,h-1)
                  c=tuple(int(top[i]*(1-t)+bottom[i]*t) for i in range(3))
                  d.line((0,y,w,y),fill=c)
              return im

          # Full-screen redraw based on the approved moon/castle reference.
          W,H=1080,2400
          bg=vertical_gradient((W,H),(4,8,27),(8,12,31)).convert('RGBA')

          # Nebula/cloud glow.
          cloud=Image.new('RGBA',(W,H),(0,0,0,0)); cd=ImageDraw.Draw(cloud)
          for side in ('left','right'):
              for _ in range(70):
                  x=random.randint(-140,520) if side=='left' else random.randint(560,1220)
                  y=random.randint(180,980)
                  r=random.randint(55,175)
                  cd.ellipse((x-r,y-r*.55,x+r,y+r*.55),fill=(104,75,143,random.randint(18,48)))
          cloud=cloud.filter(ImageFilter.GaussianBlur(34))
          bg=Image.alpha_composite(bg,cloud)
          d=ImageDraw.Draw(bg)

          # Stars.
          for _ in range(430):
              x=random.randrange(W); y=random.randrange(20,1550)
              r=1 if random.random()<.92 else 2
              v=random.randint(145,235)
              d.ellipse((x-r,y-r,x+r,y+r),fill=(v,max(120,v-15),min(255,v+20),random.randint(110,220)))

          # Crescent at upper left, softly glowing.
          glow=Image.new('RGBA',(W,H),(0,0,0,0)); gd=ImageDraw.Draw(glow)
          gd.ellipse((105,135,365,395),fill=(214,197,255,115))
          glow=glow.filter(ImageFilter.GaussianBlur(34)); bg=Image.alpha_composite(bg,glow); d=ImageDraw.Draw(bg)
          d.ellipse((125,155,345,375),fill=(239,227,255,245))
          d.ellipse((205,125,386,318),fill=(10,13,40,255))

          # Distant mountains and castle silhouettes.
          d.polygon([(0,930),(170,720),(310,890),(430,690),(590,905),(760,725),(930,900),(1080,755),(1080,1220),(0,1220)],fill=(20,21,55,235))
          d.polygon([(0,1040),(190,850),(340,1030),(520,820),(710,1040),(900,850),(1080,1000),(1080,1340),(0,1340)],fill=(11,16,43,250))
          castle=(735,710)
          d.rectangle((790,770,930,1125),fill=(9,13,34,255))
          d.polygon([(770,790),(825,625),(855,790)],fill=(8,12,32,255))
          d.rectangle((808,700,842,1110),fill=(8,12,32,255))
          d.polygon([(865,800),(900,550),(940,800)],fill=(7,11,30,255))
          d.rectangle((884,680,920,1110),fill=(7,11,30,255))
          d.polygon([(925,810),(958,675),(985,810)],fill=(8,12,32,255))
          for x,y in [(818,825),(899,770),(898,845),(905,925),(951,850),(844,930)]:
              d.ellipse((x,y,x+7,y+11),fill=(244,177,112,220))

          # Fade to deep navy behind cards.
          shade=Image.new('RGBA',(W,H),(0,0,0,0)); sd=ImageDraw.Draw(shade)
          for y in range(H):
              t=max(0,min(1,(y-730)/1050))
              sd.line((0,y,W,y),fill=(4,8,25,int(25+190*t)))
          bg=Image.alpha_composite(bg,shade).convert('RGB')
          bg.save(out/'lunari_home_bg.jpg',quality=94,optimize=True,progressive=True)

          # Full-size launcher artwork: deep star field, luminous crescent and four-point star.
          S=512
          icon=vertical_gradient((S,S),(7,10,35),(10,12,43)).convert('RGBA'); di=ImageDraw.Draw(icon)
          random.seed(31)
          for _ in range(150):
              x=random.randrange(S); y=random.randrange(S); r=1 if random.random()<.95 else 2
              v=random.randint(120,220); di.ellipse((x-r,y-r,x+r,y+r),fill=(v,v,min(255,v+25),random.randint(80,180)))
          ig=Image.new('RGBA',(S,S),(0,0,0,0)); igd=ImageDraw.Draw(ig)
          igd.ellipse((58,70,432,444),fill=(210,190,255,125)); ig=ig.filter(ImageFilter.GaussianBlur(24)); icon=Image.alpha_composite(icon,ig); di=ImageDraw.Draw(icon)
          di.ellipse((72,82,420,430),fill=(231,216,255,255))
          di.ellipse((190,38,468,348),fill=(9,11,39,255))
          # four-point star
          cx,cy=352,214
          pts=[(cx,cy-66),(cx+15,cy-16),(cx+66,cy),(cx+15,cy+16),(cx,cy+66),(cx-15,cy+16),(cx-66,cy),(cx-15,cy-16)]
          di.polygon(pts,fill=(247,232,255,255)); di.polygon([(cx,cy-44),(cx+10,cy-10),(cx+44,cy),(cx+10,cy+10),(cx,cy+44),(cx-10,cy+10),(cx-44,cy),(cx-10,cy-10)],fill=(189,133,255,255))
          icon.convert('RGB').save(out/'lunari_launcher_icon.jpg',quality=95,optimize=True)

          SIZE=512
          def canvas(c1,c2):
              im=vertical_gradient((SIZE,SIZE),c1,c2); dr=ImageDraw.Draw(im)
              random.seed(sum(c1)+77)
              for _ in range(90):
                  x=random.randrange(SIZE); y=random.randrange(SIZE); r=random.choice([1,1,2])
                  dr.ellipse((x-r,y-r,x+r,y+r),fill=(145,125,205))
              return im,dr

          im,dr=canvas((9,15,42),(40,31,78))
          dr.ellipse((128,68,392,420),fill=(38,31,72),outline=(203,174,244),width=4)
          for off,col,wid in [(0,(132,104,196),34),(18,(164,132,220),24),(38,(195,166,237),16)]: dr.arc((92+off,38,410-off,445),95,285,fill=col,width=wid)
          dr.ellipse((208,138,338,330),fill=(205,164,174)); dr.polygon([(215,150),(282,100),(350,170),(318,198),(238,190)],fill=(115,84,171))
          dr.ellipse((244,205,260,215),fill=(33,26,48)); dr.ellipse((296,203,312,213),fill=(33,26,48)); dr.arc((258,232,306,272),15,165,fill=(109,58,90),width=4)
          im.save(out/'lunari_character.jpg',quality=92,optimize=True)

          im,dr=canvas((9,14,42),(62,43,106)); dr.ellipse((78,58,210,190),fill=(218,198,255)); dr.ellipse((115,48,238,170),fill=(18,18,53))
          for pts,col in [([(0,390),(125,260),(230,390)],(25,31,78)), ([(110,410),(270,210),(430,410)],(31,30,87)), ([(290,410),(420,285),(512,410)],(22,26,68))]: dr.polygon(pts,fill=col)
          dr.polygon([(255,315),(282,178),(302,315)],fill=(13,16,44)); dr.rectangle((264,247,294,356),fill=(14,17,48)); dr.polygon([(215,356),(279,270),(345,356)],fill=(16,19,54))
          for x,y in [(276,280),(290,294),(260,305)]: dr.ellipse((x,y,x+6,y+9),fill=(226,176,118))
          im.save(out/'lunari_world.jpg',quality=92,optimize=True)

          im,dr=canvas((9,15,43),(31,28,82)); dr.rounded_rectangle((82,150,314,326),radius=70,fill=(105,76,196),outline=(210,188,255),width=4); dr.polygon([(130,318),(118,382),(188,326)],fill=(105,76,196)); dr.rounded_rectangle((220,225,430,370),radius=62,fill=(34,39,92),outline=(129,104,205),width=4); dr.polygon([(360,360),(405,410),(397,348)],fill=(34,39,92))
          for x in [145,195,245]: dr.ellipse((x,226,x+20,246),fill=(230,219,255))
          for x in [285,330,375]: dr.ellipse((x,286,x+16,302),fill=(145,129,218))
          im.save(out/'lunari_chat.jpg',quality=92,optimize=True)

          im,dr=canvas((9,15,40),(37,29,75)); dr.rounded_rectangle((145,100,378,410),radius=26,fill=(37,39,92),outline=(185,141,211),width=5); dr.rectangle((165,120,194,390),fill=(63,44,89)); dr.line((205,120,205,390),fill=(201,151,112),width=3); dr.ellipse((235,176,330,270),fill=(221,196,255)); dr.ellipse((267,158,350,250),fill=(37,39,92))
          for x,y in [(226,142),(333,144),(230,320),(330,330),(282,116)]: dr.line((x-8,y,x+8,y),fill=(211,170,239),width=3); dr.line((x,y-8,x,y+8),fill=(211,170,239),width=3)
          im.save(out/'lunari_memory.jpg',quality=92,optimize=True)

          expected={'lunari_home_bg.jpg':(1080,2400),'lunari_launcher_icon.jpg':(512,512),'lunari_character.jpg':(512,512),'lunari_world.jpg':(512,512),'lunari_chat.jpg':(512,512),'lunari_memory.jpg':(512,512)}
          for name,size in expected.items():
              with Image.open(out/name) as check: check.verify()
              with Image.open(out/name) as check:
                  assert check.size==size,(name,check.size)
                  print(name,check.size,check.mode)
          PY

      - name: Activate Lunari reference home
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("app/src/main/java/com/vega/yakor/Screens.kt")
          s=p.read_text(encoding="utf-8")
          old="Route.Home -> HomeScreen(store, navigate)"
          new="Route.Home -> LunariHomeV2(store, navigate)"
          if old in s: s=s.replace(old,new,1)
          elif new not in s: raise SystemExit("Home route marker not found")
          p.write_text(s,encoding="utf-8")
          PY

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lunari-0.2.2-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

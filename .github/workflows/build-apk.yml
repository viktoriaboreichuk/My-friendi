name: Build Lunari APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master", "lunari-ui-refresh", "lunari-026-stage" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
          cache-provider: basic

      - name: Prepare Lunari background resource
        shell: bash
        run: |
          set -euo pipefail
          test -s app/src/main/res/drawable-nodpi/lunari_home_bg.jpg
          cp app/src/main/res/drawable-nodpi/lunari_home_bg.jpg \
             app/src/main/res/drawable-nodpi/lunari_home_bg_v025.jpg
          test -s app/src/main/res/drawable-nodpi/lunari_home_bg_v025.jpg
          file app/src/main/res/drawable-nodpi/lunari_home_bg_v025.jpg

      - name: Verify Lunari artwork
        shell: bash
        run: |
          set -euo pipefail
          test -s app/src/main/res/drawable-nodpi/lunari_home_bg_v025.jpg
          test -s app/src/main/res/drawable-nodpi/lunari_character.webp
          test -s app/src/main/res/drawable-nodpi/lunari_world.webp
          test -s app/src/main/res/drawable-nodpi/lunari_chat.webp
          test -s app/src/main/res/drawable-nodpi/lunari_memory.webp
          test -s app/src/main/res/drawable-nodpi/lunari_profiles.webp
          test -s app/src/main/res/drawable-nodpi/lunari_snapshots.webp
          test -s app/src/main/res/drawable-nodpi/lunari_launcher_icon.jpg

      - name: Activate Lunari home
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("app/src/main/java/com/vega/yakor/Screens.kt")
          s = p.read_text(encoding="utf-8")
          old = "Route.Home -> HomeScreen(store, navigate)"
          new = "Route.Home -> LunariHomeV2(store, navigate)"
          if old in s:
              s = s.replace(old, new, 1)
          elif new not in s:
              raise SystemExit("Home route marker not found")
          p.write_text(s, encoding="utf-8")
          PY

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK exists
        shell: bash
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/debug/app-debug-unsigned.apk
          sha256sum app/build/outputs/apk/debug/app-debug-unsigned.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lunari-0.2.6-unsigned-base
          path: app/build/outputs/apk/debug/app-debug-unsigned.apk
          if-no-files-found: error

      - name: Prepare Android signing tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p signing-tools
          cp "$ANDROID_HOME/build-tools/35.0.0/apksigner" signing-tools/
          cp "$ANDROID_HOME/build-tools/35.0.0/zipalign" signing-tools/
          cp -R "$ANDROID_HOME/build-tools/35.0.0/lib" signing-tools/
          chmod +x signing-tools/apksigner signing-tools/zipalign

      - name: Upload Android signing tools
        uses: actions/upload-artifact@v4
        with:
          name: android-signing-tools-35.0.0
          path: signing-tools
          if-no-files-found: error

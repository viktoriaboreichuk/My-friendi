name: Build Lunari APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master", "lunari-ui-refresh" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
          cache-provider: basic

      - name: Restore approved Lunari 0.2.5 background
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/res/drawable-nodpi
          cat \
            assets/v025/bg.part00.b64 \
            assets/v025/bg.rest00.b64 \
            assets/v025/bg.rest01.b64 \
            assets/v025/bg.rest02.b64 \
            assets/v025/bg.rest03.b64 \
            assets/v025/bg.rest04.b64 \
            assets/v025/bg.rest05.b64 \
            assets/v025/bg.rest06.b64 \
            assets/v025/bg.rest07.b64 \
            assets/v025/bg.rest08.b64 \
            assets/v025/bg.rest09.b64 \
            assets/v025/bg.rest10.b64 \
            assets/v025/bg.rest11.b64 \
            assets/v025/bg.rest12.b64 \
            assets/v025/bg.rest13.0.b64 \
            assets/v025/bg.rest13.1.b64 \
            assets/v025/bg.rest13.2.b64 \
            assets/v025/bg.rest13.3.b64 \
            assets/v025/bg.rest14.0.b64 \
            assets/v025/bg.rest14.1.b64 \
            | tr -d '\r\n' \
            | base64 --decode \
            > app/src/main/res/drawable-nodpi/lunari_home_bg_v025.webp

          echo "a6d3c0eacabaabe8f1bb23a1d1ef87254790b2413686ffc8f34b9a37071691dc  app/src/main/res/drawable-nodpi/lunari_home_bg_v025.webp" | sha256sum -c -
          file app/src/main/res/drawable-nodpi/lunari_home_bg_v025.webp

      - name: Verify Lunari 0.2.5 artwork
        shell: bash
        run: |
          set -euo pipefail
          test -s app/src/main/res/drawable-nodpi/lunari_home_bg_v025.webp
          test -s app/src/main/res/drawable-nodpi/lunari_character.webp
          test -s app/src/main/res/drawable-nodpi/lunari_world.webp
          test -s app/src/main/res/drawable-nodpi/lunari_chat.webp
          test -s app/src/main/res/drawable-nodpi/lunari_memory.webp
          test -s app/src/main/res/drawable-nodpi/lunari_profiles.webp
          test -s app/src/main/res/drawable-nodpi/lunari_snapshots.webp
          test -s app/src/main/res/drawable-nodpi/lunari_launcher_icon.jpg

      - name: Activate Lunari home
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("app/src/main/java/com/vega/yakor/Screens.kt")
          s = p.read_text(encoding="utf-8")
          old = "Route.Home -> HomeScreen(store, navigate)"
          new = "Route.Home -> LunariHomeV2(store, navigate)"
          if old in s:
              s = s.replace(old, new, 1)
          elif new not in s:
              raise SystemExit("Home route marker not found")
          p.write_text(s, encoding="utf-8")
          PY

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK exists
        shell: bash
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lunari-0.2.5-unsigned-base
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

name: Build Lunari APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master", "lunari-ui-refresh" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
          cache-provider: basic

      - name: Restore Lunari signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: lunari-stable-debug-key-v1

      - name: Ensure stable debug signing key
        shell: bash
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore ~/.android/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Lunari,C=NL" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi
          keytool -list -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey | grep -E "SHA256:|Owner:" || true

      - name: Prepare Lunari 0.2.3 artwork
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check pillow
          mkdir -p app/src/main/res/drawable-nodpi

          cat assets/lunari_home_bg_v2.part*.b64 | tr -d '\r\n' | base64 --decode > /tmp/lunari_home_source.bin
          tr -d '\r\n' < assets/lunari_launcher_icon.b64 | base64 --decode > /tmp/lunari_icon_source.bin

          python - <<'PY'
          from PIL import Image, ImageDraw, ImageFilter, ImageOps, ImageEnhance
          from pathlib import Path
          import random

          out = Path('app/src/main/res/drawable-nodpi')
          random.seed(203)
          R = Image.Resampling.LANCZOS

          def vertical_gradient(size, top, bottom):
              w, h = size
              im = Image.new('RGB', size)
              d = ImageDraw.Draw(im)
              for y in range(h):
                  t = y / max(1, h - 1)
                  c = tuple(int(top[i] * (1 - t) + bottom[i] * t) for i in range(3))
                  d.line((0, y, w, y), fill=c)
              return im

          # Approved generated moon/castle art becomes the actual full-screen background.
          home_src = Image.open('/tmp/lunari_home_source.bin').convert('RGB')
          bg = ImageOps.fit(home_src, (1080, 2400), method=R, centering=(0.50, 0.48))
          bg = ImageEnhance.Contrast(bg).enhance(1.05)
          bg = ImageEnhance.Color(bg).enhance(1.06).convert('RGBA')

          # Keep the art visible but make lower cards readable.
          shade = Image.new('RGBA', bg.size, (0, 0, 0, 0))
          sd = ImageDraw.Draw(shade)
          for y in range(bg.height):
              t = max(0.0, min(1.0, (y - 740) / 1280))
              sd.line((0, y, bg.width, y), fill=(3, 7, 23, int(20 + 188 * t)))
          bg = Image.alpha_composite(bg, shade).convert('RGB')
          bg.save(out / 'lunari_home_bg.jpg', quality=94, optimize=True, progressive=True)

          # Approved crescent/star source, padded before Android's adaptive mask.
          icon_src = Image.open('/tmp/lunari_icon_source.bin').convert('RGB')
          icon_src = ImageOps.fit(icon_src, (512, 512), method=R, centering=(0.5, 0.5))
          icon_src = ImageEnhance.Contrast(icon_src).enhance(1.04)
          icon_src.save(out / 'lunari_launcher_icon.jpg', quality=95, optimize=True)

          SIZE = 512
          def canvas(c1=(8, 12, 36), c2=(38, 27, 73)):
              im = vertical_gradient((SIZE, SIZE), c1, c2).convert('RGBA')
              dr = ImageDraw.Draw(im)
              for _ in range(115):
                  x = random.randrange(SIZE); y = random.randrange(SIZE)
                  r = 1 if random.random() < .90 else 2
                  a = random.randint(90, 205)
                  dr.ellipse((x-r, y-r, x+r, y+r), fill=(190, 171, 235, a))
              return im

          def glow_disc(im, box, color=(177, 133, 255, 112), blur=24):
              layer = Image.new('RGBA', im.size, (0, 0, 0, 0))
              ld = ImageDraw.Draw(layer)
              ld.ellipse(box, fill=color)
              layer = layer.filter(ImageFilter.GaussianBlur(blur))
              return Image.alpha_composite(im, layer)

          # Character: luminous portrait silhouette, readable at 82dp circle size.
          im = glow_disc(canvas(), (95, 55, 420, 430)); dr = ImageDraw.Draw(im)
          dr.ellipse((174, 112, 356, 328), fill=(211, 169, 184, 255))
          dr.pieslice((136, 72, 392, 354), 182, 360, fill=(71, 48, 111, 255))
          dr.polygon([(168,174),(220,92),(336,116),(376,218),(338,190),(298,147),(244,174)], fill=(82,55,128,255))
          dr.ellipse((218, 205, 230, 214), fill=(30, 23, 45, 255)); dr.ellipse((292, 203, 304, 212), fill=(30, 23, 45, 255))
          dr.arc((238, 222, 294, 272), 20, 160, fill=(118, 67, 92, 255), width=4)
          dr.polygon([(126, 450),(192, 310),(335, 310),(420, 450)], fill=(47, 37, 86, 255))
          im.convert('RGB').save(out/'lunari_character.jpg', quality=93, optimize=True)

          # World: moonlit citadel and mountains.
          im = glow_disc(canvas((7,11,35),(51,36,94)), (55, 34, 244, 220), color=(221,205,255,120), blur=22); dr = ImageDraw.Draw(im)
          dr.ellipse((72, 48, 225, 201), fill=(232, 218, 255, 255)); dr.ellipse((126, 25, 258, 171), fill=(12, 15, 43, 255))
          dr.polygon([(0,420),(105,272),(190,389),(285,230),(376,386),(455,284),(512,360),(512,512),(0,512)], fill=(25,29,73,255))
          dr.polygon([(164,454),(255,312),(350,454)], fill=(14,18,50,255)); dr.rectangle((238,320,281,460), fill=(12,16,45,255)); dr.polygon([(227,325),(260,210),(293,325)], fill=(11,15,43,255))
          for x,y in [(250,356),(266,379),(253,408)]: dr.ellipse((x,y,x+7,y+11), fill=(241,180,119,230))
          im.convert('RGB').save(out/'lunari_world.jpg', quality=93, optimize=True)

          # Chat: glass-like floating messages.
          im = glow_disc(canvas((8,12,37),(43,31,87)), (64,80,440,422), blur=30); dr = ImageDraw.Draw(im)
          dr.rounded_rectangle((68,132,330,306), radius=64, fill=(118,83,208,238), outline=(224,207,255,220), width=4)
          dr.polygon([(119,290),(102,370),(186,305)], fill=(118,83,208,238))
          dr.rounded_rectangle((215,235,451,383), radius=57, fill=(31,37,88,244), outline=(151,126,219,200), width=4)
          dr.polygon([(370,370),(426,430),(414,357)], fill=(31,37,88,244))
          for x in (140,190,240): dr.ellipse((x,210,x+18,228), fill=(242,232,255,255))
          for x in (282,332,382): dr.ellipse((x,298,x+15,313), fill=(169,149,229,255))
          im.convert('RGB').save(out/'lunari_chat.jpg', quality=93, optimize=True)

          # Memory: enchanted grimoire and moon seal.
          im = glow_disc(canvas((7,12,35),(43,30,73)), (125,68,420,445), blur=28); dr = ImageDraw.Draw(im)
          dr.rounded_rectangle((132,92,392,430), radius=29, fill=(45,43,92,255), outline=(197,151,223,235), width=5)
          dr.rectangle((151,112,183,410), fill=(75,49,99,255)); dr.line((196,112,196,410), fill=(213,161,117,220), width=3)
          dr.ellipse((224,168,338,282), fill=(225,205,255,255)); dr.ellipse((266,146,363,254), fill=(45,43,92,255))
          for x,y in [(218,135),(347,137),(221,335),(348,342),(288,111)]:
              dr.line((x-9,y,x+9,y), fill=(221,181,247,230), width=3); dr.line((x,y-9,x,y+9), fill=(221,181,247,230), width=3)
          im.convert('RGB').save(out/'lunari_memory.jpg', quality=93, optimize=True)

          # Profiles: portrait medallion, visually related but distinct from Characters.
          im = glow_disc(canvas((9,13,39),(50,32,82)), (78,54,430,446), color=(188,143,255,110), blur=28); dr = ImageDraw.Draw(im)
          dr.ellipse((133,80,378,387), fill=(38,34,78,255), outline=(211,184,244,240), width=5)
          dr.ellipse((204,130,316,270), fill=(205,162,180,255)); dr.pieslice((176,104,347,286), 178, 360, fill=(68,44,105,255))
          dr.polygon([(160,410),(209,276),(315,276),(371,410)], fill=(95,71,151,255))
          dr.arc((102,60,404,410), 90, 270, fill=(159,121,223,230), width=14)
          im.convert('RGB').save(out/'lunari_profiles.jpg', quality=93, optimize=True)

          # Snapshots: magical camera with a crescent-lens glow.
          im = glow_disc(canvas((8,12,36),(47,31,81)), (72,82,446,444), color=(175,132,255,115), blur=28); dr = ImageDraw.Draw(im)
          dr.rounded_rectangle((91,164,430,374), radius=39, fill=(37,38,84,255), outline=(191,158,235,235), width=5)
          dr.rounded_rectangle((145,126,245,180), radius=20, fill=(51,48,101,255))
          dr.ellipse((190,184,340,334), fill=(12,17,48,255), outline=(216,193,252,255), width=8)
          dr.ellipse((218,210,312,304), fill=(110,79,182,255)); dr.ellipse((250,198,327,284), fill=(15,19,52,255))
          dr.ellipse((365,197,386,218), fill=(233,211,255,255))
          im.convert('RGB').save(out/'lunari_snapshots.jpg', quality=93, optimize=True)

          expected = {
              'lunari_home_bg.jpg': (1080,2400),
              'lunari_launcher_icon.jpg': (512,512),
              'lunari_character.jpg': (512,512),
              'lunari_world.jpg': (512,512),
              'lunari_chat.jpg': (512,512),
              'lunari_memory.jpg': (512,512),
              'lunari_profiles.jpg': (512,512),
              'lunari_snapshots.jpg': (512,512),
          }
          for name, size in expected.items():
              with Image.open(out/name) as check:
                  check.verify()
              with Image.open(out/name) as check:
                  assert check.size == size, (name, check.size)
                  print(name, check.size, check.mode)
          PY

      - name: Activate Lunari reference home
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("app/src/main/java/com/vega/yakor/Screens.kt")
          s=p.read_text(encoding="utf-8")
          old="Route.Home -> HomeScreen(store, navigate)"
          new="Route.Home -> LunariHomeV2(store, navigate)"
          if old in s: s=s.replace(old,new,1)
          elif new not in s: raise SystemExit("Home route marker not found")
          p.write_text(s,encoding="utf-8")
          PY

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK signature
        shell: bash
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lunari-0.2.3-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

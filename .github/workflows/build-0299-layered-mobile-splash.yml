name: Build Lunari 0.2.9.10 Layered mobile portrait splash correction

on:
  workflow_dispatch:
  pull_request:
    branches: [ "main", "master" ]
    paths:
      - 'app/src/main/java/com/vega/yakor/LunariSplash0299.kt'
      - 'app/src/main/java/com/vega/yakor/MainActivity.kt'
      - 'Lunari-0.2.9.9-splash-compact-pack.zip'
      - 'tools/lunari_0299_layered_splash_patch.py'
      - '.github/workflows/build-0299-layered-mobile-splash.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
          cache-provider: basic

      - name: Restore accepted Lunari visual assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/res/drawable-nodpi

          BASE="Lunari-0.2.6-ui-assets.zip"
          test -s "$BASE"
          echo "6f19916fb7a5b556eb24d9bb702120af7f78131c19ac2a3e4564b8f3093d1ec3  $BASE" | sha256sum -c -
          unzip -t "$BASE"
          rm -rf /tmp/lunari026-base && mkdir -p /tmp/lunari026-base
          unzip -q "$BASE" -d /tmp/lunari026-base
          echo "c0e4cf96971e10de6f147314caf3f81e6c0426cfa1a6049966b6325745a6e16a  /tmp/lunari026-base/lunari_logo_026.webp" | sha256sum -c -
          echo "2517ad57dd6d5060f1f9e8f5105e990c10ca7cc8a02f3d799b7084000e0a199e  /tmp/lunari026-base/lunari_home_bg_v025.webp" | sha256sum -c -
          cp /tmp/lunari026-base/lunari_logo_026.webp app/src/main/res/drawable-nodpi/
          cp /tmp/lunari026-base/lunari_home_bg_v025.webp app/src/main/res/drawable-nodpi/

          PACK="Lunari-0.2.7-ui-assets.zip"
          test -s "$PACK"
          echo "2a81c2c792ab6428484e943f3eeb8249dad206e8ccbba2267fa76d9b23e7de99  $PACK" | sha256sum -c -
          unzip -t "$PACK"
          rm -rf /tmp/lunari027-assets && mkdir -p /tmp/lunari027-assets
          unzip -q "$PACK" -d /tmp/lunari027-assets
          cp /tmp/lunari027-assets/lunari_card_overlay_0*.webp app/src/main/res/drawable-nodpi/

          FRAME="Lunari-0.2.8-artwork-frame.png"
          test -s "$FRAME"
          echo "01732f718aead7097894a445667848bf596ee632251dae73a4900cfe325f21a2  $FRAME" | sha256sum -c -
          cp "$FRAME" app/src/main/res/drawable-nodpi/lunari_artwork_frame_028.png

          ASSET_COMMIT="0d6c302b3f6035c9f87fc0560e806b18dd61a1cf"
          ASSET_ZIP="/tmp/Lunari-0.2.9.3-glow-assets.zip"
          git fetch --no-tags --depth=1 origin "$ASSET_COMMIT"
          git show FETCH_HEAD:Lunari-0.2.9.3-glow-assets.zip > "$ASSET_ZIP"
          test -s "$ASSET_ZIP"
          test "$(git hash-object "$ASSET_ZIP")" = "7cc8c84e416e715031e5f7cf921b00c4bc0d530d"
          echo "46e87269269f08d57714a67d38236b9d843fee1ed708370ca65ec337f92f7576  $ASSET_ZIP" | sha256sum -c -
          unzip -t "$ASSET_ZIP"
          rm -rf /tmp/lunari0293-glow && mkdir -p /tmp/lunari0293-glow
          unzip -q "$ASSET_ZIP" -d /tmp/lunari0293-glow
          for i in 01 02 03 04 05 06; do
            f="/tmp/lunari0293-glow/lunari_card_glow_custom_${i}.png"
            test -s "$f"
            test "$(xxd -p -l 8 "$f")" = "89504e470d0a1a0a"
            cp "$f" app/src/main/res/drawable-nodpi/
          done

      - name: Install exact user-supplied splash asset pack
        shell: bash
        run: |
          set -euo pipefail
          PACK="Lunari-0.2.9.9-splash-compact-pack.zip"
          test -s "$PACK"
          echo "4a8a1b53de99e30d0b3a8f588b72ce811a8fd46b841791375110c2dbc7307407  $PACK" | sha256sum -c -
          unzip -t "$PACK"
          mkdir -p app/src/main/res/drawable-nodpi
          rm -rf /tmp/lunari0299-splash && mkdir -p /tmp/lunari0299-splash
          unzip -q "$PACK" -d /tmp/lunari0299-splash
          echo "ee32ef118c160f8f3950bf0b7710f5b4210f249ca4c75cdadcf4db2a93f2e663  lunari_splash_base_0299.webp" > /tmp/lunari0299.sha256
          echo "2b64f838d0a4ae88ae909d475aa245d18f90f4ae784f5a595aae680bcff25c7c  lunari_splash_atlas_0299.webp" >> /tmp/lunari0299.sha256
          echo "36280fbc27ede1d8545b8a64482bac48dce2e2414c8c8d14c6dc404cde526239  atlas_meta.json" >> /tmp/lunari0299.sha256
          (cd /tmp/lunari0299-splash && sha256sum -c /tmp/lunari0299.sha256)
          for f in /tmp/lunari0299-splash/*.webp; do
            test "$(head -c 4 "$f")" = "RIFF"
          done
          cp /tmp/lunari0299-splash/lunari_splash_base_0299.webp app/src/main/res/drawable-nodpi/
          cp /tmp/lunari0299-splash/lunari_splash_atlas_0299.webp app/src/main/res/drawable-nodpi/

      - name: Verify full-resolution atlas geometry before Gradle
        shell: bash
        run: |
          set -euo pipefail
          META=/tmp/lunari0299-splash/atlas_meta.json
          grep -F '"src_atlas":[4,4,571,713]' "$META"
          grep -F '"src_atlas":[933,721,937,386]' "$META"
          grep -F '"src_atlas":[893,1214,915,281]' "$META"
          grep -F '"src_atlas":[1163,1536,638,42]' "$META"
          grep -F 'FULL-resolution atlas coordinates' tools/lunari_0299_layered_splash_patch.py
          ! grep -F 'Sprite0299(2, 2, 286, 357' tools/lunari_0299_layered_splash_patch.py
          ! grep -F 'Sprite0299(466, 360, 469, 193' tools/lunari_0299_layered_splash_patch.py

      - name: Verify preserved category artwork
        shell: bash
        run: |
          set -euo pipefail
          for f in lunari_character.webp lunari_world.webp lunari_chat.webp lunari_memory.webp lunari_profiles.webp lunari_snapshots.webp; do
            test -s "app/src/main/res/drawable-nodpi/$f"
          done

      - name: Apply Lunari 0.2.9.10 layered splash correction
        shell: bash
        run: |
          set -euo pipefail
          HOME_KT="app/src/main/java/com/vega/yakor/LunariHomeV2.kt"
          test "$(git hash-object "$HOME_KT")" = "aaaa2fd0f4480d3358966c5978143a01338d56f7"
          python tools/lunari_0299_layered_splash_patch.py

      - name: Verify version and splash scope
        shell: bash
        run: |
          set -euo pipefail
          HOME_KT="app/src/main/java/com/vega/yakor/LunariHomeV2.kt"
          MAIN_KT="app/src/main/java/com/vega/yakor/MainActivity.kt"
          SPLASH_KT="app/src/main/java/com/vega/yakor/LunariSplash0299.kt"

          grep -F 'applicationId = "com.vega.yakor"' app/build.gradle.kts
          grep -F 'versionCode = 22' app/build.gradle.kts
          grep -F 'versionName = "0.2.9.10"' app/build.gradle.kts
          grep -F 'val glowAlpha = if (title == "Миры" || title == "Чаты") 0.55f else 1f' "$HOME_KT"
          grep -F 'Route.Home -> LunariHomeV2(store, navigate)' app/src/main/java/com/vega/yakor/Screens.kt

          grep -F 'var showSplash by remember { mutableStateOf(true) }' "$MAIN_KT"
          grep -F 'LunariSplash0299(' "$MAIN_KT"
          grep -F 'fadeOut(animationSpec = tween(durationMillis = 450))' "$MAIN_KT"

          grep -F 'R.drawable.lunari_splash_base_0299' "$SPLASH_KT"
          grep -F 'R.drawable.lunari_splash_atlas_0299' "$SPLASH_KT"
          grep -F 'Sprite0299(4, 4, 571, 713, 41, 550, 571, 713)' "$SPLASH_KT"
          grep -F 'Sprite0299(933, 721, 937, 386, 4, 809, 937, 386)' "$SPLASH_KT"
          grep -F 'Sprite0299(893, 1214, 915, 281, 24, 854, 915, 281)' "$SPLASH_KT"
          grep -F 'drawSprite(TRAIL4_0299' "$SPLASH_KT"
          grep -F 'makeSettledDust0299()' "$SPLASH_KT"
          grep -F 'makeTravellingDust0299()' "$SPLASH_KT"
          grep -F 'activeDot = (activeDot + 1) % 4' "$SPLASH_KT"
          grep -F 'text = "Загрузка... $progressPercent%"' "$SPLASH_KT"
          grep -F 'durationMillis = 5200' "$SPLASH_KT"
          grep -F 'delay(5650)' "$SPLASH_KT"
          grep -F 'contentScale = ContentScale.Fit' "$SPLASH_KT"
          ! grep -F 'ContentScale.Crop' "$SPLASH_KT"
          ! grep -F 'ContentScale.FillBounds' "$SPLASH_KT"

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          BADGING=$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -n 2)
          echo "$BADGING"
          echo "$BADGING" | grep -q "package: name='com.vega.yakor'"
          echo "$BADGING" | grep -q "versionCode='22'"
          echo "$BADGING" | grep -q "versionName='0.2.9.10'"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 -v 4 "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          sha256sum "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lunari-0.2.9.10-layered-mobile-splash-unsigned-base
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload apksigner tool for local stable signing
        uses: actions/upload-artifact@v4
        with:
          name: android-apksigner-35
          path: |
            ${{ env.ANDROID_HOME }}/build-tools/35.0.0/apksigner
            ${{ env.ANDROID_HOME }}/build-tools/35.0.0/lib/apksigner.jar
          if-no-files-found: error
